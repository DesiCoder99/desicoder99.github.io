<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Returns Visualization</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.1/dist/chart.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #chartContainer {
            width: 80%;
            max-width: 800px;
        }
        #inputContainer {
            margin-bottom: 20px;
        }
        input, button {
            margin: 5px;
            padding: 5px;
        }
    </style>
</head>
<body>
    <h1>Stock Returns Visualization</h1>
    <div id="inputContainer">
        <input type="text" id="tickerInput" placeholder="Ticker (e.g., AAPL)" value="AAPL">
        <input type="number" id="startYearInput" placeholder="Start Year (e.g., 2000)" value="2000">
        <input type="number" id="durationInput" placeholder="Duration (years, e.g., 10)" value="10">
        <input type="password" id="apiKeyInput" placeholder="Polygon.io API Key (optional)" value="CDqyko6YCDEdr6x5tcHsN5CLowU9oxvM">
        <button id="updateButton">Update Chart</button>
    </div>
    <div id="errorMessage" style="color: red; margin-top: 10px;"></div>
    <div id="chartContainer">
        <canvas id="scatterChart"></canvas>
    </div>

    <script>
        let chart;

        function calculateCAGR10Y(data, durationYears) {
            // Calculate CAGR for all N-year windows starting at each week
            const results = [];
            const weeksPerYear = 52;  // Weekly data
            const weeksInWindow = durationYears * weeksPerYear;

            for (let i = 0; i < data.length - weeksInWindow; i++) {
                const startDate = new Date(data[i].date);
                const endDate = new Date(data[i + weeksInWindow].date);
                const startYear = startDate.getFullYear();
                const startPrice = parseFloat(data[i].close);
                const endPrice = parseFloat(data[i + weeksInWindow].close);

                // CAGR = (Ending Value / Beginning Value) ^ (1 / Number of Years) - 1
                const cagr = Math.pow(endPrice / startPrice, 1 / durationYears) - 1;

                results.push({
                    startYear: startYear,
                    cagr: cagr,
                    startPrice: startPrice,
                    endPrice: endPrice,
                    startDate: startDate,
                    endDate: endDate
                });
            }
            return results;
        }

        function createChart(data, durationYears) {
            const ctx = document.getElementById('scatterChart').getContext('2d');

            if (chart) {
                chart.destroy();
            }

            // Group by start year and compute average CAGR
            const yearMap = {};
            data.forEach(d => {
                if (!yearMap[d.startYear]) {
                    yearMap[d.startYear] = [];
                }
                yearMap[d.startYear].push(d.cagr);
            });

            const chartData = Object.entries(yearMap)
                .map(([year, cagrs]) => ({
                    x: parseInt(year),
                    y: cagrs.reduce((a, b) => a + b, 0) / cagrs.length  // average CAGR for the year
                }))
                .sort((a, b) => a.x - b.x);

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: `${durationYears}-Year Rolling CAGR`,
                        data: chartData,
                        borderColor: 'rgb(75, 192, 192)',
                        backgroundColor: 'rgba(75, 192, 192, 0.1)',
                        borderWidth: 2,
                        pointRadius: 5,
                        pointHoverRadius: 8,
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: {
                            type: 'linear',
                            position: 'bottom',
                            title: {
                                display: true,
                                text: 'Start Year'
                            }
                        },
                        y: {
                            type: 'linear',
                            title: {
                                display: true,
                                text: 'CAGR (%)'
                            },
                            ticks: {
                                callback: function(value) {
                                    return (value * 100).toFixed(1) + '%';
                                }
                            }
                        }
                    },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `Start Year: ${Math.floor(context.raw.x)}, CAGR: ${(context.raw.y * 100).toFixed(2)}%`;
                                }
                            }
                        },
                        legend: {
                            display: true
                        },
                        title: {
                            display: true,
                            text: `${durationYears}-Year Rolling CAGR`
                        }
                    }
                }
            });
        }

        async function updateChart() {
            const ticker = document.getElementById('tickerInput').value.toUpperCase();
            const durationYears = parseInt(document.getElementById('durationInput').value);
            const apiKey = document.getElementById('apiKeyInput').value;
            const errorMessageElement = document.getElementById('errorMessage');

            errorMessageElement.textContent = 'Fetching data...';

            try {
                if (!durationYears || durationYears < 1) {
                    throw new Error('Duration must be at least 1 year');
                }

                // Single large range query with retry logic
                const startDateStr = '2000-01-01';
                const endDate = new Date();
                const endDateStr = `${endDate.getFullYear()}-${String(endDate.getMonth() + 1).padStart(2, '0')}-${String(endDate.getDate()).padStart(2, '0')}`;

                let data = null;
                let retries = 0;
                const maxRetries = 5;

                while (!data && retries < maxRetries) {
                    const url = `https://api.polygon.io/v2/aggs/ticker/${ticker}/range/1/week/${startDateStr}/${endDateStr}?adjusted=true&sort=asc&limit=50000&apikey=${apiKey}`;

                    console.log(`Attempt ${retries + 1}: Fetching weekly data...`);
                    errorMessageElement.textContent = `Fetching data (attempt ${retries + 1}/${maxRetries})...`;

                    try {
                        const response = await fetch(url);
                        
                        if (response.status === 429) {
                            // Rate limited - wait and retry
                            const waitTime = Math.pow(2, retries) * 2000;  // 2s, 4s, 8s, 16s, 32s
                            console.warn(`Rate limited (429). Waiting ${waitTime}ms before retry...`);
                            errorMessageElement.textContent = `Rate limited. Waiting ${waitTime / 1000}s before retry...`;
                            await new Promise(r => setTimeout(r, waitTime));
                            retries++;
                            continue;
                        }

                        if (!response.ok) {
                            const errData = await response.json().catch(() => ({}));
                            throw new Error(`HTTP ${response.status}: ${errData.status || 'API error'}`);
                        }

                        data = await response.json();
                    } catch (err) {
                        if (err.message.includes('429')) {
                            // Already handled above
                            continue;
                        }
                        throw err;
                    }
                }

                if (!data) {
                    throw new Error('Failed to fetch data after retries. API rate limit exceeded.');
                }

                console.log('Response:', data);

                if (!data.results || data.results.length === 0) {
                    throw new Error(`No data for ticker ${ticker}. Try a different symbol.`);
                }

                // Convert Polygon aggregates to stock format
                const stockData = data.results
                    .map(d => ({
                        date: new Date(d.t).toISOString().split('T')[0],
                        close: d.c
                    }))
                    .sort((a, b) => new Date(a.date) - new Date(b.date));

                console.log(`✓ Fetched ${stockData.length} weekly records for ${ticker}`);

                // Calculate rolling CAGR for specified duration
                const cagrData = calculateCAGR10Y(stockData, durationYears);
                console.log(`Calculated CAGR for ${cagrData.length} windows (${durationYears} year duration)`);

                if (cagrData.length === 0) {
                    errorMessageElement.textContent = `Not enough data for ${durationYears}-year rolling CAGR. Have ${stockData.length} weeks (~${(stockData.length / 52).toFixed(1)} years).`;
                    return;
                }

                createChart(cagrData, durationYears);
                errorMessageElement.textContent = '';
            } catch (error) {
                console.error('Error:', error);
                errorMessageElement.textContent = `Error: ${error.message}`;
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('updateButton').addEventListener('click', updateChart);
            updateChart();
        });
    </script>
</body>
</html>
