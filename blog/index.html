<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - DesiCoder99's DevShed</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #1e1e1e;
            --bg-darker: #1a1a1a;
            --accent-cyan: #9cdcfe;
            --accent-green: #ce9178;
            --accent-purple: #c586c0;
            --text-primary: #d4d4d4;
            --text-secondary: #858585;
            --border-color: #3e3e42;
            --hover-shadow: 0 0 20px rgba(156, 220, 254, 0.2);
        }

        body {
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-darker) 100%);
            color: var(--text-primary);
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Background grid effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 217, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 217, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: -1;
        }

        nav {
            background: rgba(10, 14, 39, 0.95);
            border-bottom: 1px solid var(--border-color);
            padding: 1.2rem 2rem;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 30px rgba(0, 217, 255, 0.05);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        nav a {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            padding: 0.5rem 1rem;
            border-left: 2px solid transparent;
            display: block;
        }

        nav a:hover {
            color: var(--accent-cyan);
            border-left-color: var(--accent-cyan);
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
        }

        .container {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .blog-header {
            margin-bottom: 3rem;
        }

        .blog-header p {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-top: 0.5rem;
        }

        .blog-posts {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .blog-post {
            padding: 2rem;
            background: rgba(30, 41, 70, 0.4);
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--accent-cyan);
            border-radius: 8px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
        }

        .blog-post:hover {
            background: rgba(30, 41, 70, 0.6);
            border-left-color: var(--accent-green);
            box-shadow: var(--hover-shadow);
            transform: translateX(4px);
        }

        .post-meta {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .post-date::before {
            content: '📅 ';
        }

        .post-category {
            color: var(--accent-purple);
        }

        .post-category::before {
            content: '🏷️ ';
        }

        .post-title {
            font-size: 1.5rem;
            color: var(--accent-cyan);
            margin-bottom: 0.75rem;
            font-weight: 700;
        }

        .post-excerpt {
            color: var(--text-primary);
            line-height: 1.8;
            margin-bottom: 1rem;
        }

        .read-more {
            color: var(--accent-green);
            font-weight: 600;
            display: inline-block;
        }

        .read-more::after {
            content: ' →';
            transition: transform 0.3s ease;
            display: inline-block;
        }

        .blog-post:hover .read-more::after {
            transform: translateX(5px);
        }

        footer {
            background: rgba(10, 14, 39, 0.95);
            border-top: 1px solid var(--border-color);
            padding: 2rem;
            text-align: center;
            box-shadow: 0 -4px 30px rgba(0, 217, 255, 0.05);
            backdrop-filter: blur(10px);
            margin-top: auto;
        }

        footer ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        footer a {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        footer a:hover {
            color: var(--accent-cyan);
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            nav ul {
                gap: 1rem;
            }

            nav a {
                padding: 0.3rem 0.7rem;
                font-size: 0.85rem;
            }

            .container {
                padding: 2rem 1rem;
            }

            .post-title {
                font-size: 1.2rem;
            }

            .blog-post {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/about.html">About</a></li>
            <li><a href="/blog">Blog</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="blog-header">
            <h1>Blog</h1>
            <p>Thoughts on code, crypto, and chaos</p>
        </div>

        <div class="blog-posts" id="blog-posts">
            <div class="loading" style="text-align: center; padding: 3rem; color: var(--text-secondary);">
                Loading posts...
            </div>
        </div>
    </div>

    <footer>
        <ul>
            <li><a href="mailto:codemajdoor@gmail.com">email</a></li>
            <li><a href="https://github.com/DesiCoder99">github.com/DesiCoder99</a></li>
        </ul>
    </footer>

    <script>
        // Load blog posts from posts.json
        async function loadPosts() {
            try {
                const response = await fetch('/blog/posts.json');
                const posts = await response.json();

                const container = document.getElementById('blog-posts');

                if (posts.length === 0) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-secondary); padding: 3rem;">No posts yet. Check back soon!</p>';
                    return;
                }

                // Sort posts by date (newest first)
                posts.sort((a, b) => new Date(b.date) - new Date(a.date));

                // Generate HTML for each post
                container.innerHTML = posts.map(post => `
                    <a href="post.html?id=${post.id}" class="blog-post">
                        <div class="post-meta">
                            <span class="post-date">${formatDate(post.date)}</span>
                            <span class="post-category">${post.category}</span>
                        </div>
                        <h2 class="post-title">${post.title}</h2>
                        <p class="post-excerpt">${post.excerpt}</p>
                        <span class="read-more">Read more</span>
                    </a>
                `).join('');
            } catch (error) {
                console.error('Error loading posts:', error);
                document.getElementById('blog-posts').innerHTML =
                    '<p style="text-align: center; color: #ff6b6b; padding: 3rem;">Error loading posts. Please try again later.</p>';
            }
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long'
            });
        }

        // Load posts when page loads
        document.addEventListener('DOMContentLoaded', loadPosts);
    </script>
</body>
</html>
